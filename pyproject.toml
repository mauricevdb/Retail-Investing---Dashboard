[project]
name = "ri-dashboard"
version = "0.1.0"
description = "Tableau de bord de retail investing, multi-marchés à terme"
requires-python = ">=3.12,<3.13"
dependencies = [
    "polars>=1.0",
    "duckdb>=1.0",
    "streamlit>=1.38",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "contact: test de contact réseau réel à un fournisseur (invariant 9 de CLAUDE.md) ; jamais dans la suite par défaut",
]
addopts = "-m \"not contact\""
