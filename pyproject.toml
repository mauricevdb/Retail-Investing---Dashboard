[project]
name = "ridash"
version = "0.1.0"
description = "Retail investing dashboard: value screen of US equities built on SEC filings and EODHD market data."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.0",
    "streamlit>=1.38",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
